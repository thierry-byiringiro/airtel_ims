<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Employee</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <!-- NAVBAR -->
    <div class="navbar">
        <h2>Inventory Management System</h2>
        <div>
            <a th:href="@{/}">Dashboard</a>
            <a th:href="@{/assets}">Assets</a>
            <a th:href="@{/employees}">Employees</a>
            <a th:href="@{/assignments}">Assignments</a>
        </div>
    </div>

    <!-- FORM -->
    <div class="form-container">
        <h2>Add Employee</h2>

        <form th:action="@{/employees/save}" method="post" th:object="${employee}">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" th:field="*{name}" placeholder="e.g. John Doe" required>
            </div>

            <div class="form-group">
                <label>Department</label>
                <input type="text" th:field="*{department}" placeholder="e.g. Finance Department">
            </div>

            <div class="form-actions">
                <a th:href="@{/employees}" class="btn-secondary">Back</a>
                <button type="submit" class="btn-primary">Save Employee</button>
            </div>

        </form>
    </div>

</div>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
